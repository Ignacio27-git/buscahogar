# Entorno de desarrollo local. Solo se levanta la base de datos: `web` e `ingestion`
# se ejecutan en local (`pnpm dev:web`, `pnpm dev:ingestion`). Ver README, «Base de datos».

# Nombre de proyecto explícito: sin él, Compose lo deriva del nombre del directorio, así
# que un worktree con otro nombre crearía contenedores y volúmenes distintos en silencio.
name: buscahogar

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      # Sin valor por defecto a propósito: si falta la variable, Compose falla al
      # instante. Postgres, en cambio, arrancaría con sus valores por defecto y
      # crearía una base de datos distinta de la esperada, con PostGIS en el sitio
      # equivocado; el error no aparecería hasta la primera conexión de la aplicación.
      POSTGRES_USER: '${POSTGRES_USER:?falta POSTGRES_USER en .env}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}'
      POSTGRES_DB: '${POSTGRES_DB:?falta POSTGRES_DB en .env}'
    ports:
      # Asimetría intencionada: el lado del host es configurable, el del contenedor es
      # siempre 5432 porque el entrypoint de postgres no lee POSTGRES_PORT. No
      # "corregir" a ${POSTGRES_PORT}:${POSTGRES_PORT}. DATABASE_URL debe apuntar al
      # puerto del host.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Ruta correcta para las etiquetas 14-17. A partir de la 18 la imagen movió el
      # volumen a /var/lib/postgresql (sin /data): revisarla al subir de versión.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapa la interpolación de Compose para que las variables las expanda la
      # shell del contenedor, no Compose.
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      # start_period cubre el primer arranque: sobre un volumen vacío la imagen crea
      # el cluster y la extensión PostGIS antes de aceptar conexiones. Los fallos
      # dentro de esta ventana no cuentan como reintentos.
      start_period: 30s
      retries: 5

  # web e ingestion se declaran para dejar constancia de los tres servicios de
  # docs/ARCHITECTURE.md, pero durante el desarrollo NO se levantan con Docker: se
  # ejecutan en local con `pnpm dev:web` y `pnpm dev:ingestion`, y solo la base de datos
  # corre en contenedor. Por eso quedan fuera del perfil por defecto: `docker compose
  # up -d` levanta solo db. `ingestion` ya tiene Dockerfile (apps/ingestion/Dockerfile, paso 3.4 S5a);
  # `web` se construirá con `docker compose --profile app up` cuando exista el suyo.
  web:
    profiles: ['app']
    build:
      # Contexto en la raíz: es un monorepo pnpm y la construcción necesita el
      # lockfile y los packages compartidos, no solo apps/web.
      context: .
      dockerfile: apps/web/Dockerfile
    # ROADMAP 1.11, docs/DECISIONS.md decisión 056 (enmienda la 015): `web`
    # recibe SU PROPIA credencial de solo lectura, nunca `env_file` (que le
    # daría también la credencial de escritura de `ingestion` y las de las
    # fuentes). `WEB_DATABASE_URL` vive en el `.env` de la raíz junto a la de
    # `ingestion`, bajo un nombre distinto para que no colisionen; nunca una
    # variable `NEXT_PUBLIC_*`.
    environment:
      # Sin `:?`: esa forma aborta la interpolación del fichero ENTERO, también
      # para `docker compose up -d` sin `--profile`, que la decisión 015
      # garantiza que levanta solo `db`. El fallo ruidoso vive donde toca, en
      # `apps/web/src/server/db.ts`: lanza un error nombrado citando la decisión
      # 056 cuando falta la variable, y está probado en `apps/web/test/db.test.ts`.
      DATABASE_URL: '${WEB_DATABASE_URL}'
      # ROADMAP 1.15 (security-hardening, decisión 064/069) — credencial de
      # escritura ACOTADA (`web_coverage`, solo `coverage_jobs` +
      # `coverage_client_quota`), nunca la de `ingestion` (`env_file`
      # completo, más abajo). Igual que `WEB_DATABASE_URL`: sin `:?`, mismo
      # motivo — el fallo ruidoso vive en `apps/web/src/server/coverage-db.ts`.
      WEB_COVERAGE_DATABASE_URL: '${WEB_COVERAGE_DATABASE_URL}'
      # Tope de zonas nuevas por día (DD-14) — decisión de operación, nunca
      # inventado en código (`apps/web/src/server/env.ts`).
      NEW_ZONES_DAILY_CAP: '${NEW_ZONES_DAILY_CAP}'
      # ROADMAP 1.15 (spec #261 "request-rate-limiting", decisión 075/078) —
      # AUSENTE o vacía = ambos limitadores por IP deshabilitados (D1a): por
      # eso son `${VAR:-}`, nunca `${VAR:?}` — el kill switch de rollback es
      # una única variable, documentado en design #262 "Migration / Rollout".
      CLIENT_IP_HEADER: '${CLIENT_IP_HEADER:-}'
      # Requerida SOLO cuando CLIENT_IP_HEADER está definida
      # (`apps/web/src/server/env.ts`, `readClientLimitConfig`); el fallo
      # ruidoso vive ahí, nunca en Compose.
      CLIENT_IP_HMAC_KEY: '${CLIENT_IP_HMAC_KEY:-}'
      COVERAGE_PER_CLIENT_DAILY_CAP: '${COVERAGE_PER_CLIENT_DAILY_CAP:-}'
      PROXY_RATE_LIMIT_MAX: '${PROXY_RATE_LIMIT_MAX:-}'
      PROXY_RATE_LIMIT_WINDOW_SECONDS: '${PROXY_RATE_LIMIT_WINDOW_SECONDS:-}'
    depends_on:
      db:
        condition: service_healthy

  ingestion:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile
    # Paso 3.4 (decisión 258) — worker en modo producción: JavaScript compilado, usuario no root. SIN política
    # de reinicio a propósito: la política (y el cierre ordenado) pertenece al host y se fija en el paso 3.5; el
    # worker ya se supervisa a sí mismo (backoff, salida 1 tras 10 caídas seguidas, 2 config, 3 base inaccesible).
    # `init` recoge huérfanos y reenvía SIGTERM; `stop_grace_period` debe superar WORKER_STOP_GRACE_MS (8 s por
    # defecto): primero el worker cierra el barrido en el límite de página (o sale 1 al vencer su plazo) y solo
    # después Docker enviaría SIGKILL.
    init: true
    stop_grace_period: 20s
    # Las credenciales de escritura y las de las fuentes viven solo aquí.
    # `web` (arriba) recibe una `environment:` propia y acotada, nunca este
    # `env_file` completo (docs/DECISIONS.md, decisión 056).
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # Paso 3.4 (decisión 257) — despliegue de UN SOLO USO: migraciones, roles, privilegios, semillas y
  # comprobaciones contra la URL DIRECTA del propietario. Perfil propio (`docker compose --profile deploy
  # run --rm deploy`), sin política de reinicio y esperando a que la base esté sana: no es un servicio que
  # se quede levantado. Reutiliza la imagen de `ingestion` (el Dockerfile llega con el worker, S5a, y debe
  # dejar el JS compilado en `dist-runtime/`). Nunca `env_file`: solo las variables del despliegue; sin `:?`
  # por el mismo motivo que `web` (aborta la interpolación del fichero entero) — el fallo ruidoso vive en
  # `apps/ingestion/src/deploy/deploy-env.ts` (exit 2). La URL apunta al host `db` de la red de Compose.
  deploy:
    profiles: ['deploy']
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile
    working_dir: /app/apps/ingestion
    command: ['node', 'dist-runtime/scripts/deploy.js']
    restart: 'no'
    environment:
      DIRECT_DATABASE_URL: '${DEPLOY_DIRECT_DATABASE_URL:-}'
      WEB_READONLY_PASSWORD: '${WEB_READONLY_PASSWORD:-}'
      WEB_COVERAGE_PASSWORD: '${WEB_COVERAGE_PASSWORD:-}'
      WEB_READONLY_ROLE: '${WEB_READONLY_ROLE:-}'
      WEB_COVERAGE_ROLE: '${WEB_COVERAGE_ROLE:-}'
      SEED_MONTHLY_QUOTA_TOTAL: '${SEED_MONTHLY_QUOTA_TOTAL:-}'
      SEED_MONTHLY_QUOTA_RESERVE: '${SEED_MONTHLY_QUOTA_RESERVE:-}'
    depends_on:
      db:
        condition: service_healthy

  # Paso D.1a (decisión 136) — runner autoritativo del e2e visual y de
  # accesibilidad. Perfil propio: `docker compose up -d` sigue levantando solo
  # `db`. Se lanza con `pnpm e2e` / `pnpm e2e:update` (package.json raíz).
  e2e:
    profiles: ['e2e']
    build:
      context: .
      dockerfile: Dockerfile.e2e
    # `init`: Playwright lanza Chromium y Next como procesos hijos; sin un init
    # que recoja huérfanos quedan zombis. `ipc: host`: Chromium usa memoria
    # compartida y falla sin ella (recomendación oficial de la imagen).
    init: true
    ipc: host
    # Nunca `env_file` (decisión 135, igual que `web`): solo estas variables, y
    # sin `:?` por el mismo motivo que en `web` — un `:?` abortaría la
    # interpolación del fichero ENTERO también para `docker compose up -d`. El
    # fallo ruidoso vive en el guard del seed (`packages/db/src/e2e/guard.ts`).
    # Ninguna es `NEXT_PUBLIC_*`. La credencial de propietario solo la lee el
    # seed: el entrypoint la elimina antes de lanzar Playwright.
    environment:
      # Propietario de `buscahogar_e2e` (host `db`, red de Compose).
      E2E_DATABASE_URL: '${E2E_DATABASE_URL:-}'
      # `web_readonly` sobre la misma base: la única URL que ve el servidor Next.
      E2E_WEB_DATABASE_URL: '${E2E_WEB_DATABASE_URL:-}'
      # Nombre de la base de desarrollo, para que el guard la rechace por nombre.
      E2E_DEV_DATABASE_NAME: '${POSTGRES_DB:-}'
    volumes:
      # Solo lo que se versiona o se inspecciona. El código NO se monta.
      - ./apps/web/e2e/baselines:/app/apps/web/e2e/baselines
      - ./apps/web/test-results:/app/apps/web/test-results
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    # Nombre fijado explícitamente para que `docker volume rm buscahogar_postgres_data`
    # funcione igual desde cualquier directorio o worktree.
    name: buscahogar_postgres_data
