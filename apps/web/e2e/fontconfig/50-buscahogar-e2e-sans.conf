<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Paso D.18 (decisión 217) — fontconfig determinista de la imagen e2e.

  En la imagen de Playwright `sans-serif` resuelve a WenQuanYi Zen Hei (25-wqy-zenhei y 64-wqy-zenhei
  lo anteponen) y esa familia no tiene negrita: todo el texto de peso 600 salía sin énfasis. Se
  antepone Liberation Sans con `prepend_first` y enlace `strong`, que la deja la primera de la lista
  sea cual sea el orden de los demás ficheros (un `<alias><prefer>` depende de ese orden). Liberation
  no tiene cara SemiBold: el peso 600 se pinta con Bold 700, sin sintetizar.

  Solo se copia en la imagen e2e; la de producción no la usa.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>sans</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
